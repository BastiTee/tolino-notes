[tool.poetry]
name = "tolino_notes"
version = "0.3.2"
description = ""
license = "Apache 2.0"
authors = ["Basti Tee <basti.tee@icloud.com>"]
maintainers = ["Basti Tee <basti.tee@icloud.com>"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[tool.poetry.dependencies]
python = "^3.10.0"
click = "8.5.0"

[tool.poetry.dev-dependencies]
autopep8 = "2.3.2"
flake8 = "7.3.0"
flake8-quotes = "3.4.0"
flake8-docstrings = "1.7.0"
flake8-builtins = "3.1.0"
flake8-blind-except = "0.2.1"
flake8-use-fstring = "1.4"
flake8-isort = "7.0.0"
pep8-naming = "0.15.1"
isort = "9.0.1"
pytest = "9.1.1"
mypy = "2.3.1"
typing-extensions = "4.16.0"
black = "26.5.1"
pipdeptree = "4.2.3"

[tool.poetry.scripts]
tolino-notes = 'tolino_notes.__main__:main'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# Untyped definitions and calls
# Disallows defining functions without type annotations or with
# incomplete type annotations.
disallow_untyped_defs = true
# Type-checks the interior of functions without type annotations
check_untyped_defs = true
# Import discovery
follow_imports = "normal"
ignore_missing_imports = true
# Warning configuration
warn_unused_ignores = true
warn_unreachable = true
# Error message config
# pretty = true

[tool.pytest.ini_options]
addopts = ["-p", "no:warnings"]

[tool.black]
skip-string-normalization = true
